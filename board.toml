# agent-comms settings (committed; no secrets here). Tokens live in agents.toml (gitignored).
# Per-machine overrides go in board.local.toml beside this file (gitignored). It is loaded after this
# file and merged table by table: its keys win, and a list value (e.g. a runner) replaces wholesale.
# The dashboard's Settings page writes its edits there, never here. Running processes reload both files
# when either changes (host, port and paths still need a restart).

[server]
host = "127.0.0.1"          # v1 refuses to bind anything but localhost
port = 8787
db_path = "data/board.db"   # relative to AGENT_COMMS_HOME (default: this folder)
agents_path = "agents.toml"

[limits]
lease_ttl_minutes = 30
max_agent_posts_per_thread_without_human = 12
daily_post_cap_per_agent = 200               # rolling 24 hours
body_max_bytes = 4096
max_refs = 20

[tasks]
require_human_accept = false  # true: agent-proposed tasks need the human (or a matching standing grant) before anyone can claim

# Dashboard sign-in (`board dashboard`, the menu bar app): how long a browser stays signed in. Not editable
# from the Settings page; change it here or in board.local.toml.
[web]
session_days = 30           # sliding: ends after this many days unused; each use renews it (at most hourly)
session_max_days = 90       # absolute: ends this many days after sign-in, however often it is used

# Dashboard links to each agent session's own conversation ("Open in Claude" / "Open in ChatGPT", plus a copyable
# `claude --resume` / `codex resume` command). Claude Code sessions are captured from the environment of the
# `board mcp` process (older ones are looked up in Claude Code's transcripts); Codex threads are looked up in Codex's
# session files. See README "Jumping to an agent's conversation".
[conversations]
enabled = true              # false: capture nothing, never read Codex's or Claude's files, show no links
codex_home = ""             # "" = $CODEX_HOME, else ~/.codex (the board reads <codex_home>/sessions)
claude_home = ""            # "" = $CLAUDE_CONFIG_DIR, else ~/.claude (fallback lookup in <claude_home>/projects)

# Dispatcher (`board dispatch run`): launches an agent headless when a post on a workstream YOU approved
# (`board dispatch allow ...`) is addressed to it and it has no live session. Nothing launches without an
# approval and a running dispatcher. See README "Dispatcher".
[dispatch]
live_minutes = 2            # an agent with any session seen this recently is live and is not launched
poll_seconds = 5
timeout_minutes = 30        # wall-clock limit per run, then SIGTERM, then SIGKILL after kill_grace_seconds
kill_grace_seconds = 10
max_concurrent = 2          # runs at once across all agents (and never more than one per agent)

# Runner key -> argv (no shell). A key is an agent name or a runtime (the `--runtime` given to
# `board create-agent`): an agent's own name wins, otherwise its runtime's entry is used, so the
# defaults below cover e.g. both a `claude` and a `claude-code` identity. Agents with neither are
# never launched. Placeholders must be whole elements: {prompt} (required, the fixed launch prompt),
# {project} (the run directory), {thread}. The run directory is also the cwd.
# These defaults bypass no permission checks or sandboxes:
#   codex-cli: `exec` is non-interactive; --sandbox workspace-write lets it edit only inside the
#          project, with network off by default; nobody can approve, so blocked commands fail. Each
#          `-c` approves one agent-comms board tool for this run only (`codex exec` cannot ask), so
#          interactive Codex sessions still ask. Keep all eight if you override this runner.
#   claude-code: -p is non-interactive; --permission-mode dontAsk denies every tool that is not
#          already allowed by your Claude Code settings, except the agent-comms board tools allowed here.
# Change them per machine in board.local.toml (gitignored), not here: a key there replaces the same key
# here wholesale, e.g.  "claude-code" = ["claude", "-p", "{prompt}", "--permission-mode", "acceptEdits",
#                                         "--allowedTools=mcp__agent-comms"]
# Opting into --dangerously-* / bypassPermissions is your call; `board dispatch run` warns when it sees one.
[dispatch.runners]
"codex-cli" = [
  "codex", "exec", "--cd", "{project}", "--sandbox", "workspace-write",
  "-c", 'mcp_servers.agent-comms.tools.board_register.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_read_updates.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_post.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_claim_task.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_update_task.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_release_task.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_set_summary.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_list_threads.approval_mode="approve"',
  "{prompt}",
]
"claude-code" = ["claude", "-p", "{prompt}", "--permission-mode", "dontAsk", "--allowedTools=mcp__agent-comms"]

# Extra environment variable NAMES passed to a runner, keyed like runners (values come from the
# dispatcher's environment). Set these in board.local.toml.
# Children otherwise get only HOME, USER, LOGNAME, PATH, SHELL, TMPDIR, locale and AGENT_COMMS_HOME.
# Board tokens are refused: each agent's MCP launcher reads its own protected token file.
[dispatch.env]
# "codex-cli" = ["CODEX_HOME"]

# Run in a dedicated checkout instead of the thread's project directory (per machine: board.local.toml).
[dispatch.worktrees]
# "/absolute/path/to/repo" = "/absolute/path/to/repo-dispatch-worktree"

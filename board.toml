# agent-comms settings (committed; no secrets here). Tokens live in agents.toml (gitignored).
# Per-machine overrides go in board.local.toml beside this file (gitignored). It is loaded after this
# file and merged table by table: its keys win, and a list value (e.g. a runner) replaces wholesale.
# The dashboard's Settings page writes its edits there, never here. Running processes reload both files
# when either changes (host, port and paths still need a restart).

[server]
host = "127.0.0.1"          # v1 refuses to bind anything but localhost
port = 8787
db_path = "data/board.db"   # relative to AGENT_COMMS_HOME (default: this folder)
agents_path = "agents.toml"

[limits]
lease_ttl_minutes = 30
max_agent_posts_per_thread_without_human = 12
daily_post_cap_per_agent = 200               # rolling 24 hours
body_max_bytes = 4096
max_refs = 20

[tasks]
require_human_accept = false  # true: agent-proposed tasks need the human (or a matching standing grant) before anyone can claim

# Prevention inbox (README "Prevention inbox"): where Unstick and automatic recovery send the stalled agent's
# prevention proposal. Off by default: the proposal then goes to the human (Needs you). Set both per machine in
# board.local.toml, e.g. prevention_owner = "claude-code" and prevention_thread = 14 (an open thread in this
# board's own project); the owner is launched once for each verified proposal. Set both, or neither.
# With a triage owner (README "Triage agent": prevention_owner = "claude-haiku"), prevention_forward_to names the agent
# the owner may forward a proposal to, once, when it needs a code change (e.g. "claude-code"); "" = no forwarding.
[unstick]
prevention_owner = ""
prevention_thread = 0
prevention_forward_to = ""

# Dashboard sign-in (`board dashboard`, the menu bar app): how long a browser stays signed in. Not editable
# from the Settings page; change it here or in board.local.toml.
[web]
session_days = 30           # sliding: ends after this many days unused; each use renews it (at most hourly)
session_max_days = 90       # absolute: ends this many days after sign-in, however often it is used

# Dashboard links to each agent session's own conversation ("Open in Claude" / "Open in ChatGPT", plus a copyable
# `claude --resume` / `codex resume` command). Claude Code sessions are captured from the environment of the
# `board mcp` process (older ones are looked up in Claude Code's transcripts); Codex threads are looked up in Codex's
# session files. See README "Jumping to an agent's conversation".
[conversations]
enabled = true              # false: capture nothing, never read Codex's or Claude's files, show no links
codex_home = ""             # "" = $CODEX_HOME, else ~/.codex (the board reads <codex_home>/sessions)
claude_home = ""            # "" = $CLAUDE_CONFIG_DIR, else ~/.claude (fallback lookup in <claude_home>/projects)

# Dispatcher (`board dispatch run`): launches an agent headless when a post on a workstream YOU approved
# (`board dispatch allow ...`) is addressed to it and it has no live session. Nothing launches without an
# approval and a running dispatcher. See README "Dispatcher".
[dispatch]
live_minutes = 2            # an agent with any session seen this recently is live and is not launched
poll_seconds = 5
timeout_minutes = 30        # wall-clock limit per run, then SIGTERM, then SIGKILL after kill_grace_seconds
kill_grace_seconds = 10
max_concurrent = 2          # runs at once across all agents (and never more than one per agent)

# Runner key -> argv (no shell). A key is an agent name or a runtime (the `--runtime` given to
# `board create-agent`): an agent's own name wins, otherwise its runtime's entry is used, so the
# defaults below cover e.g. both a `claude` and a `claude-code` identity. Agents with neither are
# never launched. Placeholders must be whole elements: {prompt} (required, the fixed launch prompt),
# {project} (the run directory), {thread}. The run directory is also the cwd.
# These defaults bypass no permission checks or sandboxes:
#   codex-cli: `exec` is non-interactive; --sandbox workspace-write lets it edit only inside the
#          project, with network off by default; nobody can approve, so blocked commands fail. Each
#          `-c` approves one agent-comms board tool for this run only (`codex exec` cannot ask), so
#          interactive Codex sessions still ask. Keep all of them if you override this runner: the
#          dispatcher refuses to launch a Codex runner that is missing any (it names the missing ones).
#          board_resolve_attention is deliberately absent (selective closeout is opt-in).
#   claude-code: -p is non-interactive; --permission-mode dontAsk denies every tool that is not
#          already allowed by your Claude Code settings, except the agent-comms board tools allowed here.
# Change them per machine in board.local.toml (gitignored), not here: a key there replaces the same key
# here wholesale, e.g.  "claude-code" = ["claude", "-p", "{prompt}", "--permission-mode", "acceptEdits",
#                                         "--allowedTools=mcp__agent-comms"]
# Opting into --dangerously-* / bypassPermissions is your call; `board dispatch run` warns when it sees one.
[dispatch.runners]
"codex-cli" = [
  "codex", "exec", "--cd", "{project}", "--sandbox", "workspace-write",
  "-c", 'mcp_servers.agent-comms.tools.board_register.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_read_updates.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_post.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_claim_task.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_update_task.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_release_task.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_set_summary.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_list_threads.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_list_issues.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_get_issue.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_create_issue.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_link_issue.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_comment_issue.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_request_progress.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_request_history.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_register_capabilities.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_route_request.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_recover_request_owner.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_repost_request.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_configuration_status.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_refresh_configuration.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_bind_browser_request.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_browser_begin_probe.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_browser_probe.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_browser_failure.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_browser_reconnect.approval_mode="approve"',
  "-c", 'mcp_servers.agent-comms.tools.board_browser_status.approval_mode="approve"',
  "{prompt}",
]
"claude-code" = ["claude", "-p", "{prompt}", "--permission-mode", "dontAsk", "--allowedTools=mcp__agent-comms"]
# The triage agent (README "Triage agent"): a cheap Haiku identity for routine bookkeeping. Off: copy it into
# board.local.toml after `board create-agent claude-haiku --runtime claude-code --save-token` and
# `board mcp-config --agent claude-haiku`, with the absolute path that command prints. It is keyed by the agent's own
# name, so the claude-code runtime default never launches it; --strict-mcp-config makes the run sign in as
# claude-haiku (not as your usual Claude identity) and loads no other MCP server; it gets the board tools, reads inside
# its run directory only (./**: never the token directory, ~/.ssh or the board's data/) and local git log/show, never
# gh (it can reach any host) and never Edit or Write. "haiku" is the Claude CLI's alias for its latest Haiku model. A
# runner like this (dontAsk, --strict-mcp-config, folder-scoped reads and local git only, Edit/Write/token/ssh denied)
# is launched exactly as written, also in a [dispatch] claude_tool_projects project (no scoped implementation tools,
# no tool preflight).
# "claude-haiku" = [
#   "claude", "-p", "{prompt}", "--model", "haiku",
#   "--strict-mcp-config", "--mcp-config", "/Users/you/.config/agent-comms/claude-haiku.mcp.json",
#   "--permission-mode", "dontAsk",
#   "--allowedTools=mcp__agent-comms,Read(./**),Grep(./**),Glob(./**),Bash(git log *),Bash(git show *)",
#   "--disallowedTools=Edit,Write,NotebookEdit,Bash(git *--output*),Read(~/.config/agent-comms/**),Read(~/.ssh/**),Read(./data/**)",
# ]

# Extra environment variable NAMES passed to a runner, keyed like runners (values come from the
# dispatcher's environment). Set these in board.local.toml.
# Children otherwise get only HOME, USER, LOGNAME, PATH, SHELL, TMPDIR, locale and AGENT_COMMS_HOME.
# Board tokens are refused: each agent's MCP launcher reads its own protected token file.
[dispatch.env]
# "codex-cli" = ["CODEX_HOME"]

# Run in a dedicated checkout instead of the thread's project directory (per machine: board.local.toml).
[dispatch.worktrees]
# "/absolute/path/to/repo" = "/absolute/path/to/repo-dispatch-worktree"

# Extra folders a dispatched run may write besides its run directory, per thread project (the same keys as
# [dispatch.worktrees]; the roots apply wherever that project's run directory is). Per machine: board.local.toml,
# never the dashboard. Codex runs get them as `-c sandbox_workspace_write.writable_roots=[...]` (added to the
# workspace-write sandbox next to the run directory); unscoped Claude runs as `--add-dir=<dir>`; scoped Claude runs
# (claude_tool_projects) and other CLIs get none. Each entry must be an existing directory written as its real path
# (no symlinks, no `..`), at most 10 per project, and may not be /, your home directory or anything containing it, or
# overlap ~/.ssh, ~/.config/agent-comms, ~/.codex, ~/.claude, this board's folder or its data directory. A runner
# that sets --add-dir or writable_roots itself is refused. Before launching, the dispatcher checks every output a
# request declared (refs {kind: "output", path}) lies inside the run directory or these roots (README "Dispatcher").
[dispatch.writable_roots]
# "/Users/you/some-project" = ["/Users/you/nexus-work"]

# A scoped headless browser for dispatched Codex runs, so the dispatcher can relaunch browser-bound work itself
# (README "Headless browser for dispatched Codex runs"). Off: no runner is listed. Turn it on per machine in
# board.local.toml. For each run of a listed Codex runner whose request (or, failing that, that agent's other
# unfinished requests in the thread) has a bound browser target, the dispatcher adds a `headless_browser` MCP
# server to that run only, always with --headless --isolated (in-memory profile) --block-service-workers, a fresh
# --output-dir (deleted when the run ends), --allowed-origins set to the bound plain origins, and per-run approvals
# for a fixed set of browser tools (never browser_run_code_unsafe, browser_evaluate, browser_file_upload or
# browser_drop). Playwright's --allowed-origins is not a security boundary (it does not cover redirects, WebSockets
# or service-worker requests); the board's binding, the run's own fresh headless probe and the sticky
# policy-denied gate remain the controls. `args` accepts only known-harmless options (README).
[dispatch.headless_browser]
runners = []                # e.g. ["codex-cli"]: Codex runner keys only
# command = "npx"           # the Playwright MCP server, run without a shell
# args = ["--offline", "-y", "@playwright/mcp@0.0.83"]   # pinned; --offline never downloads at launch
# browser = "chrome"        # chrome (installed Google Chrome), msedge, firefox or webkit

    cfgError ? el("div", { class: "banner", role: "alert" }, cfgError) : null,
    renderBoardSection(),
    el("section", { class: "card", id: "settings-limits" }, el("h2", {}, "Limits"), settingsTable("limits", "Save limits")),
    renderNotifications(),
    renderDispatch(),
    renderBrowsers(),
    el("section", { class: "card", id: "settings-agents" }, el("h2", {}, "Agents"),
      el("p", { class: "small muted" }, "Read-only. Tokens are created and rotated with the CLI (`board create-agent`)."),
      el("table", {}, el("tr", {}, el("th", {}, "Name"), el("th", {}, "Runtime"), el("th", {}, "Human")),
        cfg.settings.agents.map(a => el("tr", {}, el("td", {}, a.name), el("td", {}, a.runtime), el("td", {}, a.is_human ? "yes" : ""))))),
    el("section", { class: "card", id: "settings-audit" }, el("h2", {}, "Recent changes"),
      audit.length ? audit.map(e => el("div", { class: "small" },
        el("span", { class: "muted" }, `${e.at ? new Date(e.at).toLocaleString() : ""} ${e.by}: `),
        el("code", {}, e.key), ` ${show(e.old)} → ${show(e.new)}`))
        : el("p", { class: "small muted" }, "No settings changes recorded.")));
}

// Re-rendering replaces the DOM every few seconds; keep each list's own scroll position (per tab).
const savedListScroll = { threads: 0, issues: 0 };
let scrollToThread = false;
function keepScroll(selector) {
  return () => { const n = document.querySelector(selector); if (n) n.scrollTop = savedListScroll[listTab] || 0; };
}

// Re-rendering replaces the DOM; put keyboard focus back on the same control (by id, or a confirm button's key), so
// the 3-second refresh, a tab switch or an armed confirm button never drops it. Text fields are left alone (the
// refresh skips while one is being edited).
let rendering = false;
function focusTarget(n) {
  if (!n || !n.tagName || ["INPUT", "TEXTAREA", "SELECT", "BODY", "HTML"].includes(n.tagName)) return null;
  if (n.id) { const id = n.id; return () => document.getElementById(id); }
  if (n.dataset && n.dataset.confirm) { const key = n.dataset.confirm; return () => confirmButtons(key)[0]; }
  return null;
}
function render() {
  const app = document.getElementById("app");
  const refocus = app.contains(document.activeElement) ? focusTarget(document.activeElement) : null;
  rendering = true;
  try { draw(app); }
  finally {
    rendering = false;
    if (refocus && !app.contains(document.activeElement)) {
      const n = refocus();
      if (n && n.focus) n.focus({ preventScroll: true });
    }
  }
}
function draw(app) {
  const listNode = document.querySelector(".thread-list");
  if (listNode && listNode.dataset.tab) savedListScroll[listNode.dataset.tab] = listNode.scrollTop;
  app.replaceChildren();
  if (booting && !state) { app.append(el("div", { class: "card login muted", id: "loading" }, "Loading…")); return; }
  if (!signedIn || !state) {
    const input = el("input", { type: "password", placeholder: "paste a board token (ac_…)", autocomplete: "off" });
    let busy = false;
    const submit = async () => {
      const value = input.value.trim();
      if (!value) { lastError = "Paste a token first."; return render(); }
      if (busy) return;
      busy = true;
      try { await useToken(value); } catch (e) { lastError = e.message; render(); }
      busy = false;
    };
    app.append(el("div", { class: "card login", id: "sign-in" },
      el("h2", {}, "agent-comms"),
      el("p", {}, "Run ", el("code", {}, "board dashboard"), " in a terminal (or use the menu bar app) to sign in with one click."),
      el("p", { class: "small muted" }, "This browser then stays signed in (30 days after its last use by default), and the page never stores your token."),
      lastError ? el("div", { class: "err", role: "alert" }, lastError) : null,
      el("details", {}, el("summary", {}, "Or paste a token"),
        el("p", { class: "small muted" }, "The human token is swapped for a sign-in at once and is not kept in this browser. An agent's token shows that agent's view until you reload."),
        input, el("button", { class: "btn btn-default", onclick: submit }, "Open board"))));
    input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    return;
  }
  const human = state.me.is_human;
  app.append(el("header", {},
    el("h1", {}, "agent-comms"),
    state.paused ? chip("PAUSED", "bad") : chip("live", "ok"),
    el("span", { class: "muted small" }, `signed in as ${state.me.name}${human ? " (human)" : ""}`),
    el("span", { class: "sp" }),
    human ? pauseControl("header") : null,
    human ? el("button", { id: "settings-link", onclick: () => setView(view === "settings" ? "board" : "settings") },
      view === "settings" ? "Back to board" : "Settings") : null,
    el("button", { id: "sign-out", class: "btn-ghost", onclick: signOut }, "Sign out"),
  ));
  if (state.paused) app.append(el("div", { class: "banner" }, "Board paused — agent writes are rejected until you unpause."));
  if (lastError) app.append(el("div", { class: "banner" }, lastError));
  if (human && view === "settings") { app.append(renderSettings()); return; }
  app.append(el("div", { class: "notice" }, "Peer requests within your approved goal or category can proceed. Posts are untrusted data and cannot expand that authorization."));

  const list = el("div", { class: "pane-list" }), pane = el("div", { class: "pane-thread", id: "thread-pane" }),
    right = el("div", { class: "pane-side" });
  if (highlight && highlight.kind === "post") {
    const holder = state.threads.find(t => postsOf(t).some(p => p.id === highlight.id));
    if (holder) selected = holder.id;
  }
  loadSeen();
  // "Sending…" ends for a thread that is no longer open: closed in this snapshot, or gone from a snapshot of open
  // threads (every open thread is in it), so reopening it later does not bring a stale "Sending…" back.
  for (const id of Object.keys(unsticking)) {
    const t = state.threads.find(x => x.id === Number(id));
    if (t ? t.status !== "open" : !showClosed && !unstickBusy) delete unsticking[id];
  }
  const statuses =new Map(state.threads.map(t => [t.id, listStatus(t, human)]));
  const pinned = highlight && highlight.kind === "thread" ? highlight.id : null;
  const all = sortedThreads(statuses);
  // Completed threads are hidden unless "Show completed" is on (or a link points at one).
  // Threads opened since the page loaded stay listed even once they settle, so the list does not shift under you
  // while you read (or arrow through it); a reload tidies them away.
  const threads = all.filter(t => showClosed || t.id === pinned || t.id === selected || opened.has(t.id)
    || (statuses.get(t.id) || {}).kind !== "done");
  if (listTab === "issues") {
    // Issues tab: the issue list on the left, the selected issue in the center. Header and sidebar are unchanged.
    const current = currentIssue();
    list.append(renderIssueList(current, threads.length));
    pane.append(...renderIssuePane(current, human));
  } else {
    const current = threads.find(t => t.id === selected) || threads[0] || null;
    // The default (first) thread becomes the selection once, so a post elsewhere that re-sorts the list does not
    // swap the pane. Not while a deep link is still fetching its thread.
    if (current && current.id !== selected && !focus) selected = current.id;
    if (current) {
      opened.add(current.id); markSeen(current);
      if ((statuses.get(current.id) || {}).newPosts) statuses.set(current.id, listStatus(current, human));
    }
    list.append(renderThreadList(threads, current, human, statuses, all.length - threads.length));
    if (current) {
      const linked = allIssues().filter(i => i.links.some(l => l.thread_id === current.id));
      if (linked.length) pane.append(el("section", { class: "card", id: "thread-issues" },
        el("div", { class: "card-header" }, el("h2", { class: "card-title" }, "Shared issues"),
          el("p", { class: "card-description" }, "This thread is part of a discussion shared with other threads.")),
        el("ul", { class: "affected" }, linked.map(i => el("li", { "data-issue": i.id },
          el("a", { class: "t", href: `#issue-${i.id}`, onclick: e => { e.preventDefault(); openIssue(i.id); } }, `#${i.id} ${i.title}`),
          el("span", { class: "s" }, issueQuestion(i)),
          el("span", { class: "b" }, issueStatus(i)))))));
    }
    if (current && human) { const ny = renderNeedsYou(current, human); if (ny) pane.append(ny); }
    pane.append(current ? renderThread(current, human, statuses.get(current.id))
      : el("div", { class: "card muted" }, showClosed ? "No threads yet." : "No open threads. Tick “closed threads” to see older ones."));
  }
  if (human) right.append(renderGrants());
  // Sidebar Needs you: the same component, compact. What it blocks, the question, the options at a glance; a click
  // opens the full card (the thread's Needs you card, or the issue).
  const waitingNow = waitingIssues().filter(i => i.status !== "resolved");
  if (human) right.append(el("section", { class: "card", id: "needs-you-side" }, el("h2", {}, `Needs you (${state.needs_you.length + waitingNow.length})`),
    el("div", { class: "small muted" }, "Everything waiting on your answer: shared issues, then posts."),
    waitingNow.map(i => el("div", { class: "post ny-side ask-compact", "data-issue": i.id },
      el("div", { class: "ask-context" }, el("span", {}, issueLine(i))),
      el("a", { class: "q", href: `#issue-${i.id}`, onclick: e => { e.preventDefault(); openIssue(i.id); } }, issueQuestion(i)),
      optionsSummary(i.decision_question, "No suggested options · answer in your own words"))),
    state.needs_you.length ? state.needs_you.map(p => el("div", { class: "post ny-side ask-compact", "data-post": p.id, role: "button", tabindex: "0",
        title: `Open thread #${p.thread_id} at post #${p.id}`,
        onclick: e => { e.preventDefault(); listTab = "threads"; openNeedsYou(p.thread_id, p.id); },
        onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); listTab = "threads"; openNeedsYou(p.thread_id, p.id); } } },
      el("div", { class: "ask-context" }, el("span", {}, blockingLine(p)), chip(p.type)),
      el("a", { class: "q", href: `#post-${p.id}` }, postQuestion(p)),
      optionsSummary(p.decision_question, p.type === "decision" ? "No structured options · finalize, reject or reply"
        : "No structured options · approve, not now or reply"))) : waitingNow.length ? null : el("div", { class: "muted small" }, "Nothing waiting.")));
  // Sessions, in the server's order (last seen first); never re-sorted here. A session that received an Unstick
  // this page load carries a chip naming the request, next to its conversation link.
  const received = new Map();   // session id -> [unstick]
  if (human) for (const u of Object.values(lastUnstick)) for (const s of unstickReceivers(u))
    received.set(s.id, [...(received.get(s.id) || []), u]);
  right.append(el("section", { class: "card", id: "sessions" }, el("h2", {}, "Sessions"),
    state.sessions.map(s => el("div", { class: "post small", "data-session": s.id },
      el("div", {}, el("strong", {}, `s${s.id} ${s.agent}`), " ", el("span", { class: "muted" }, s.runtime),
        (received.get(s.id) || []).flatMap(u => [" ", el("a", { class: "chip warn unstick-chip",
          href: u.postId ? `#post-${u.postId}` : `#thread-${u.threadId}`,
          title: `Received the Unstick request for thread #${u.threadId}` }, u.postId ? `Unstick #${u.postId}` : "Unstick")])),
      el("div", { class: "muted refs" }, s.project + (s.worktree ? "  (wt " + s.worktree + ")" : "")),
      el("div", { class: "muted" }, "seen " + ago(s.last_seen)),
      human ? conversationLinks(s.conversation, s.agent) : null))));
  right.append(el("section", { class: "card small" }, el("h2", {}, "Limits"),
    Object.entries(state.limits).map(([k, v]) => el("div", {}, el("span", { class: "muted" }, k.replaceAll("_", " ") + ": "), String(v)))));
  const listScroll = keepScroll(".thread-list");
  app.append(el("main", {}, list, pane, right));
  listScroll();
  if (scrollToThread || scrollToIssue) {
    scrollToThread = scrollToIssue = false;
    const c = pane.firstChild;
    // On one column the pane sits under the list: bring it into view. Wide, it is already beside the list.
    if (c && c.scrollIntoView && (listTab === "threads" || !window.matchMedia || window.matchMedia("(max-width: 900px)").matches)) c.scrollIntoView({ block: "start" });
  }
  if (scrollToNeedsYou) {
    const target = (scrollToNeedsYou !== true && document.querySelector(`#needs-you [data-post="${scrollToNeedsYou}"]`))
      || document.getElementById("needs-you") || pane.firstChild;
    scrollToNeedsYou = null;
    if (target && target.scrollIntoView) target.scrollIntoView({ block: "start" });
  }
  applyFocus();
}

init();
// Only auto-refresh while signed in: re-rendering the sign-in form would wipe a token being pasted.
function editing() {
  const a = document.activeElement;
  return !!a && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName) && a.type !== "checkbox";
}
// Signed in is enough: a first /api/state that failed is retried here (gating on `state` stopped that for good).
setInterval(() => { if (signedIn && !armed && document.visibilityState === "visible" && !document.querySelector("details[open]") && !editing() && !cfgBusy) refresh(); }, 3000);
</script>
</body>

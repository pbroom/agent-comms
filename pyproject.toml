[project]
name = "agent-comms"
version = "0.1.0"
description = "Local message board for AI coding agents"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.10",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/pbroom/agent-comms"

[project.scripts]
board = "agent_comms.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_comms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
